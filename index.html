<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idou Image Production | Review</title><style>*{box-sizing:border-box}body{margin:0;background:#101014;color:#f5f1e9;font-family:Arial,'Noto Sans',sans-serif}main{max-width:680px;margin:0 auto;padding:38px 22px 65px}.brand{text-align:center;letter-spacing:5px;color:#d6b878;font-size:14px}.hero{text-align:center;padding:35px 0 25px}h1{font-size:clamp(30px,7vw,48px);margin:8px 0}p{color:#c9c4bb;line-height:1.6}.gold{color:#d6b878}.panel{background:#1c1c22;border:1px solid #4a4131;border-radius:18px;padding:24px;margin-top:22px}label{display:block;margin:22px 0 9px;font-weight:bold}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{background:#292931;color:#eee;border:1px solid #55515a;border-radius:30px;padding:11px 15px;cursor:pointer}.chip.active{background:#d6b878;color:#161616;border-color:#d6b878}select,textarea,input{width:100%;border:1px solid #59545b;border-radius:10px;background:#292931;color:white;padding:13px;font-size:15px}textarea{min-height:140px;line-height:1.6}button.primary{width:100%;background:#d6b878;color:#171717;border:0;border-radius:10px;padding:15px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:17px}.secondary{background:transparent;color:#d6b878;border:1px solid #d6b878;border-radius:10px;padding:14px;cursor:pointer;width:100%;margin-top:10px}.small{font-size:12px;color:#aaa;text-align:center;margin-top:22px}a{color:#d6b878}</style></head><body><main><div class="brand">IDOU IMAGE PRODUCTION</div><section class="hero"><div class="gold">✦ ✦ ✦ ✦ ✦</div><h1>Share Your Experience</h1><p>Make Everyone Look Like a Star.<br>感谢您让我们记录您的精彩时刻。</p></section><div class="panel"><label for="lang">Language / 语言 / Bahasa</label><select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select><label id="serviceLabel">您体验了哪一种摄影服务？</label><div class="chips" id="services"></div><label id="highLabel">您最喜欢哪些部分？（可多选）</label><div class="chips" id="highlights"></div><label id="detailLabel">想补充什么？（可选）</label><input id="detail" placeholder="例如：摄影师很会引导动作…"><button class="primary" id="generate">生成我的评价 / Generate Review</button><label id="outputLabel">您的评价（可自由修改）</label><textarea id="output" placeholder="..."></textarea><button class="secondary" id="copy">复制评价 / Copy Review</button><button class="primary" id="google">前往 Google Review ↗</button><p class="small">请根据您的真实体验修改后发布。评价不会自动提交。</p></div><p class="small">© Idou Image Production</p></main><script>
const reviewUrl='https://www.google.com/search?q=idou+image+production+reviews';
const data={zh:{service:'您体验了哪一种摄影服务？',high:'您最喜欢哪些部分？（可多选）',detail:'想补充什么？（可选）',output:'您的评价（可自由修改）',services:['活动摄影','企业形象照','颁奖典礼摄影','婚礼摄影','影棚拍摄','其他'],highlights:['照片非常漂亮','摄影师专业','很会捕捉自然表情','引导姿势很有耐心','服务亲切','交付效率高','活动气氛拍得很好'],make:(s,h,d)=>`这次体验了 Idou Image Production 的${s}服务，整体体验非常好！${h.length?'特别喜欢他们'+h.join('、')+'。':''}${d?d+'。':''}在我看来，他们真的是拍event最厉害的摄影师！感谢团队用心记录精彩瞬间，值得推荐！`},en:{service:'Which photography service did you experience?',high:'What did you enjoy most? (Select multiple)',detail:'Anything else to share? (Optional)',output:'Your review (feel free to edit)',services:['Event photography','Corporate portraits','Awards photography','Wedding photography','Studio portraits','Other'],highlights:['Beautiful photos','Professional photographer','Natural candid moments','Helpful posing guidance','Friendly service','Timely delivery','Great event atmosphere'],make:(s,h,d)=>`I had a great experience with Idou Image Production for ${s.toLowerCase()}. ${h.length?'What stood out was '+h.join(', ').toLowerCase()+'. ':''}${d?d+'. ':''}To me, they are 拍event最厉害的摄影师 (the best event photographers)! Thank you for capturing such memorable moments. Highly recommended!`},ms:{service:'Perkhidmatan fotografi yang anda gunakan?',high:'Apa yang paling anda suka? (Boleh pilih beberapa)',detail:'Ada apa-apa lagi? (Pilihan)',output:'Ulasan anda (boleh disunting)',services:['Fotografi acara','Potret korporat','Fotografi anugerah','Fotografi perkahwinan','Fotografi studio','Lain-lain'],highlights:['Gambar sangat cantik','Jurugambar profesional','Momen spontan yang menarik','Panduan gaya yang baik','Layanan mesra','Penghantaran cepat','Suasana acara dirakam dengan baik'],make:(s,h,d)=>`Saya berpuas hati dengan pengalaman bersama Idou Image Production untuk ${s.toLowerCase()}. ${h.length?'Saya amat menghargai '+h.join(', ').toLowerCase()+'. ':''}${d?d+'. ':''}Bagi saya, mereka memang 拍event最厉害的摄影师 (jurugambar acara yang terbaik)! Terima kasih kerana merakam detik-detik istimewa. Sangat disyorkan!`}};
let selectedService=0,selectedHighlights=new Set();const $=id=>document.getElementById(id);function render(){let d=data[$('lang').value];$('serviceLabel').textContent=d.service;$('highLabel').textContent=d.high;$('detailLabel').textContent=d.detail;$('outputLabel').textContent=d.output;$('services').innerHTML='';d.services.forEach((x,i)=>{let b=document.createElement('button');b.className='chip'+(selectedService===i?' active':'');b.textContent=x;b.onclick=()=>{selectedService=i;render()};$('services').appendChild(b)});$('highlights').innerHTML='';d.highlights.forEach((x,i)=>{let b=document.createElement('button');b.className='chip'+(selectedHighlights.has(i)?' active':'');b.textContent=x;b.onclick=()=>{selectedHighlights.has(i)?selectedHighlights.delete(i):selectedHighlights.add(i);render()};$('highlights').appendChild(b)})} $('lang').onchange=()=>{selectedService=0;selectedHighlights.clear();render()};$('generate').onclick=()=>{let d=data[$('lang').value];$('output').value=d.make(d.services[selectedService],[...selectedHighlights].sort().map(i=>d.highlights[i]),$('detail').value.trim())};$('copy').onclick=async()=>{if(!$('output').value.trim())$('generate').click();try{await navigator.clipboard.writeText($('output').value);$('copy').textContent='✓ Copied / 已复制'}catch(e){$('output').select();document.execCommand('copy');$('copy').textContent='✓ Copied / 已复制'}};$('google').onclick=()=>window.open(reviewUrl,'_blank','noopener');render();</script></body></html>
